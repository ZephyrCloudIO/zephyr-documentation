packages:
  - '.'

# Fails if trusted package stops being trusted
trustPolicy: no-downgrade
# Ignores trust policies for packages older than a week
trustPolicyIgnoreAfter: 10080
# Minimum of 1 day before released packages can be installed
minimumReleaseAge: 1440
# no git/tarball dependencies, only from trusted registry
blockExoticSubdeps: true
minimumReleaseAgeExclude:
  # Renovate security update: postcss@8.5.23
  - postcss@8.5.23

# Security overrides for vulnerable transitive dependencies
overrides:
  'protobufjs': '>=7.6.1 <8'
  'handlebars': '>=4.7.9'
  'tar@>=7.0.0 <7.5.11': '^7.5.11'
  '@isaacs/brace-expansion@<5.0.1': '^5.0.1'
  'axios@>=1.0.0 <1.20.0': '^1.20.0'
  'minimatch@>=10.0.0 <10.2.3': '^10.2.3'
  'minimatch@>=9.0.0 <9.0.7': '^9.0.7'
  'minimatch@<3.1.3': '^3.1.3'
  'undici@>=7.0.0 <7.29.1': '^7.29.1'
  'flatted@<3.4.2': '^3.4.2'
  'picomatch@>=4.0.0 <4.0.4': '^4.0.4'
  'picomatch@<2.3.2': '^2.3.2'
  'lodash-es@<4.18.0': '^4.18.1'
