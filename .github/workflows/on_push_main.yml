name: CI

on:
  push:
    branches:
      - main

env:
  NODE_VERSION: 24
  PUBLIC_POSTHOG_KEY: ${{ secrets.PUBLIC_POSTHOG_KEY }}
  PUBLIC_POSTHOG_HOST: ${{ secrets.PUBLIC_POSTHOG_HOST }}

jobs:
  build:
    runs-on: depot-ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Install dependencies
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0
          run_install: false
      - name: Install dependencies
        run: pnpm i

      # Run Linting
      - name: Run linting
        run: pnpm lint

      # Run the build
      - name: Run build
        env:
          ZE_SECRET_TOKEN: ${{ secrets.ZEPHYR_AUTH_TOKEN }}
        run: pnpm build

      - name: Zephyr deploy summary
        uses: ZephyrCloudIO/zephyr-preview-environment-action@main
        id: zephyr-summary
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # Refresh the DocSearch index so search reflects the content just deployed
      # instead of waiting for the crawler's scheduled run.
      - name: Trigger Algolia recrawl
        env:
          ALGOLIA_CRAWLER_USER_ID: ${{ secrets.ALGOLIA_CRAWLER_USER_ID }}
          ALGOLIA_CRAWLER_API_KEY: ${{ secrets.ALGOLIA_CRAWLER_API_KEY }}
          ALGOLIA_CRAWLER_ID: ${{ secrets.ALGOLIA_CRAWLER_ID }}
        run: |
          if [ -z "$ALGOLIA_CRAWLER_USER_ID" ] || [ -z "$ALGOLIA_CRAWLER_API_KEY" ] || [ -z "$ALGOLIA_CRAWLER_ID" ]; then
            echo "::warning::Algolia crawler secrets are not configured; skipping recrawl."
            exit 0
          fi
          curl --fail-with-body -sS -X POST \
            -u "$ALGOLIA_CRAWLER_USER_ID:$ALGOLIA_CRAWLER_API_KEY" \
            "https://crawler.algolia.com/api/1/crawlers/$ALGOLIA_CRAWLER_ID/reindex"
