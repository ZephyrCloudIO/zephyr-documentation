name: Run on Pull Request

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

env:
  NODE_VERSION: 24
  PUBLIC_POSTHOG_KEY: ${{ secrets.PUBLIC_POSTHOG_KEY }}
  PUBLIC_POSTHOG_HOST: ${{ secrets.PUBLIC_POSTHOG_HOST }}

jobs:
  verify-rsbuild-mf-guide:
    if: github.event.action != 'closed'
    runs-on: depot-ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Verify guide snippets
        run: pnpm verify:rsbuild-mf-guide

      - name: Install pinned fixture dependencies
        working-directory: fixtures/rsbuild-react-mf-monorepo
        run: pnpm install --frozen-lockfile

      - name: Verify official scaffold and pnpm add commands
        working-directory: fixtures/rsbuild-react-mf-monorepo
        run: pnpm verify:scaffold

      - name: Build and diagnose the fixture
        working-directory: fixtures/rsbuild-react-mf-monorepo
        run: pnpm verify

      - name: Install Chromium
        working-directory: fixtures/rsbuild-react-mf-monorepo
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify remotes in a browser
        working-directory: fixtures/rsbuild-react-mf-monorepo
        run: pnpm verify:browser

  deploy-on-pr-changes:
    runs-on: depot-ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Install dependencies
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false
      - name: Install dependencies
        run: pnpm i

      # Run the build
      - name: Run build
        id: build
        env:
          ZE_SECRET_TOKEN: ${{ secrets.ZEPHYR_AUTH_TOKEN }}
        run: pnpm build

      - name: Zephyr deploy summary
        uses: ZephyrCloudIO/zephyr-preview-environment-action@main
        id: zephyr-summary
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
